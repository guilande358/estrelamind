name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Microphone permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$MANIFEST"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mindflow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mindflow-android-apk
          path: mindflow.apk
